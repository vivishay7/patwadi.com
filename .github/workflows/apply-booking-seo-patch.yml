name: Apply booking SEO patch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-booking-seo-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch homepage, tracking boundary, and post booking links
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'<title>.*?</title>', '<title>Patwadi | Book Intercity Parcel, Luggage & Cargo Delivery</title>', index, count=1, flags=re.S)
          index = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="Book intercity parcel delivery, luggage shipping, carton movement and business cargo with Patwadi across active regional routes in India.">', index, count=1)

          canonical = '  <link rel="canonical" href="https://patwadi.com/">\n'
          if re.search(r'<link rel="canonical"[^>]*>', index):
              index = re.sub(r'\s*<link rel="canonical"[^>]*>\n?', '\n' + canonical, index, count=1)
          else:
              index = re.sub(r'(\s*<meta name="description" content="[^"]*">\n)', r'\1' + canonical, index, count=1)

          jsonld = '''  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://patwadi.com/#organization",
        "name": "Patwadi Logistics LLP",
        "alternateName": "Patwadi",
        "url": "https://patwadi.com/",
        "email": "admin@patwadi.com",
        "telephone": "+91 80918 89969",
        "logo": "https://patwadi.com/assets/images/patwadi-logo-transp.png",
        "areaServed": ["India", "Himachal Pradesh", "North India", "South India", "West India"]
      },
      {
        "@type": "WebSite",
        "@id": "https://patwadi.com/#website",
        "name": "Patwadi",
        "url": "https://patwadi.com/",
        "publisher": {"@id": "https://patwadi.com/#organization"},
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://patwadi.com/tracking.html?code={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "Service",
        "@id": "https://patwadi.com/#booking-service",
        "name": "Intercity parcel, luggage and cargo delivery",
        "serviceType": "Courier and cargo delivery",
        "provider": {"@id": "https://patwadi.com/#organization"},
        "url": "https://patwadi.com/",
        "areaServed": {"@type": "Country", "name": "India"},
        "description": "Book intercity parcel delivery, luggage shipping, carton movement and business cargo services across active regional routes with Patwadi."
      }
    ]
  }
  </script>
'''
          if 'https://patwadi.com/#booking-service' not in index:
              index = index.replace('  <style>\n', jsonld + '  <style>\n', 1)
          index_path.write_text(index, encoding='utf-8')

          tracking_path = root / 'tracking.html'
          tracking = tracking_path.read_text(encoding='utf-8')
          tracking = re.sub(r'<title>.*?</title>', '<title>Track Your Existing Patwadi Parcel | Shipment Tracking</title>', tracking, count=1, flags=re.S)
          tracking = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="Track an existing Patwadi parcel or shipment by tracking code. To book a new intercity parcel, luggage or cargo delivery, visit the Patwadi booking page.">', tracking, count=1)

          crosslink_css = '''
  .booking-crosslink{width:100%;max-width:520px;margin:0 auto 22px;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center;}
  .booking-crosslink a{color:var(--accent);font-weight:700;text-decoration:none;}
  .booking-crosslink a:hover{text-decoration:underline;}
'''
          if '.booking-crosslink' not in tracking:
              tracking = tracking.replace('  @media(max-width:768px)', crosslink_css + '\n  @media(max-width:768px)', 1)

          crosslink_html = '''
  <div class="booking-crosslink" role="note">
    <span>Tracking an existing parcel?</span>
    <a href="/">Book intercity parcel delivery with Patwadi &rarr;</a>
  </div>
'''
          if 'Book intercity parcel delivery with Patwadi' not in tracking:
              tracking = tracking.replace('<div class="track-content">\n', '<div class="track-content">\n' + crosslink_html, 1)
          tracking_path.write_text(tracking, encoding='utf-8')

          booking_block = '''
<section class="booking-link-block" style="margin:32px 0;padding:18px 20px;border:1px solid var(--border,#E2E8F0);border-radius:14px;background:#FFF7ED;">
  <h2 style="font-size:1.05rem;line-height:1.3;margin:0 0 8px;color:var(--ink,#0F172A);">Ready to send a parcel?</h2>
  <p style="font-size:0.9rem;line-height:1.65;margin:0 0 12px;color:var(--mid,#475569);">Book intercity parcel delivery, luggage shipping, cartons and business cargo with Patwadi across active regional routes.</p>
  <a href="/" style="display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:var(--orange,#F05A1A);color:#fff;font-weight:700;font-size:0.85rem;border-radius:8px;text-decoration:none;">Book parcel delivery with Patwadi &rarr;</a>
</section>
'''
          post_count = 0
          posts_dir = root / 'posts'
          if posts_dir.exists():
              for post_path in sorted(posts_dir.glob('*.html')):
                  if post_path.name == 'index.html':
                      continue
                  html = post_path.read_text(encoding='utf-8')
                  if 'booking-link-block' in html or 'Book parcel delivery with Patwadi' in html:
                      continue
                  if '</article>' in html:
                      html = html.replace('</article>', booking_block + '\n</article>', 1)
                  elif '<footer' in html:
                      html = html.replace('<footer', booking_block + '\n<footer', 1)
                  else:
                      html = html.replace('</body>', booking_block + '\n</body>', 1)
                  post_path.write_text(html, encoding='utf-8')
                  post_count += 1
          print(f'Applied booking SEO patch. Posts updated: {post_count}')

          workflow_path = root / '.github' / 'workflows' / 'apply-booking-seo-patch.yml'
          if workflow_path.exists():
              workflow_path.unlink()
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tracking.html posts/*.html .github/workflows/apply-booking-seo-patch.yml || true
          git commit -m "Apply homepage booking SEO signals"
          git push
